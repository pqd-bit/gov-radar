name: Gov Radar Daily Collect

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Collect programs
        env:
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: python scripts/collector.py

      - name: Send deadline alerts
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NOTIFY_DAYS: "14"
        run: python scripts/notify.py

      - name: Commit updated data
        run: |
          git config user.name "gov-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/programs.json
          git diff --cached --quiet || git commit -m "chore: update programs.json $(date -u +%Y-%m-%d)"
          git push
