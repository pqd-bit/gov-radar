name: Gov Radar News Digest

on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install feedparser requests

      - name: Collect news
        run: python scripts/news_collector.py

      - name: Send news digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python scripts/news_notify.py

      - name: Commit updated data
        run: |
          git config user.name "gov-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/news.json docs/data/news_sent.json
          git diff --cached --quiet || git commit -m "chore: update news digest $(date -u +%Y-%m-%d)"
          git push
